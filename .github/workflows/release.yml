name: Draft release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$') { throw 'Use a semantic version tag.' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test
        run: dotnet test KeyClick.sln -c Release
      - name: Build x64 and ARM64
        shell: pwsh
        run: ./scripts/Build-Portable.ps1 -Version $env:VERSION
      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: |
          dotnet tool install --global CycloneDX
          dotnet-CycloneDX KeyClick.sln -o artifacts/portable -fn sbom.cdx.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/portable/KeyClick-Windows-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/portable/*
          if-no-files-found: error
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/portable/*
