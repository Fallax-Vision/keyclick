name: Draft release

on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Validate tag
        shell: pwsh
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION_TAG.TrimStart('v')
          $semver = '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if ($version -notmatch $semver) { throw 'Use a SemVer 2.0.0 core or prerelease tag without build metadata.' }
          [xml] $properties = Get-Content Directory.Build.props
          $sourceVersion = [string] $properties.Project.PropertyGroup.VersionPrefix
          if ($version -ne $sourceVersion) { throw "Tag version $version does not match source version $sourceVersion." }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test
        run: dotnet test KeyClick.sln -c Release
      - name: Build setup and portable x64 and ARM64
        shell: pwsh
        run: ./scripts/Build-Portable.ps1 -Version $env:VERSION
      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: |
          dotnet tool restore
          $source = "KeyClick-Portable-Windows-x64-$env:VERSION.sbom.cdx.json"
          dotnet tool run dotnet-CycloneDX -- KeyClick.sln -o artifacts -fn $source
          Copy-Item "artifacts/$source" "artifacts/KeyClick-Portable-Windows-arm64-$env:VERSION.sbom.cdx.json"
          Copy-Item "artifacts/$source" "artifacts/KeyClick-Setup-Windows-x64-$env:VERSION.sbom.cdx.json"
          Copy-Item "artifacts/$source" "artifacts/KeyClick-Setup-Windows-arm64-$env:VERSION.sbom.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: artifacts/*-${{ env.VERSION }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: artifacts
      - uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: |
            artifacts/KeyClick-Portable-Windows-*.exe
            artifacts/KeyClick-Setup-Windows-*.exe
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
