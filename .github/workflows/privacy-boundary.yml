name: Privacy Boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy-boundary:
    name: Privacy Boundary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enforce offline statistics boundary
        shell: pwsh
        run: ./scripts/Test-PrivacyBoundary.ps1
      - name: Enforce repository policy
        shell: pwsh
        run: ./scripts/Test-PolicyCompliance.ps1
