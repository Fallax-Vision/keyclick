name: Privacy Boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy-boundary:
    name: Privacy Boundary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce offline statistics boundary
        shell: pwsh
        run: ./scripts/Test-PrivacyBoundary.ps1
      - name: Enforce repository policy
        shell: pwsh
        run: ./scripts/Test-PolicyCompliance.ps1
